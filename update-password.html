<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <link rel="stylesheet" href="css/update-password.css">
</head>
<body>
    <div class="login-box">
        <form id="update-password-form">
            <div class="border-text">New Password</div>

            <p class="form-hint" id="form-hint">
                Choose a new password for your account.
            </p>

            <div class="form-group">
                <label for="new-password">New password</label>
                <input
                    type="password"
                    id="new-password"
                    placeholder="New password"
                    minlength="6"
                    required
                    autofocus
                >
                <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" focusable="false" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
                        <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
                    </svg>
                </button>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm new password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
                <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" focusable="false" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
                        <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="login-button" id="update-btn">Update password</button>
        </form>

        <span id="footer-message" hidden>
            <a href="login-page.html">Back to login</a>
        </span>
    </div>

    <script src="config.js"></script>
    <script type="module" src="js/update-password.js"></script>
</body>
</html>
