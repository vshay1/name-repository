<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <div class="profile-container">

        <header class="profile-header">
            <h1>Your Profile</h1>
            <a href="overview.html" class="btn-secondary">Back to archive</a>
        </header>

        <!-- Account info -->
        <section class="profile-section">
            <h2>Account</h2>
            <p>You are signed in as <strong id="current-username">…</strong>.</p>
        </section>

        <!-- Change username -->
        <section class="profile-section">
            <h2>Change username</h2>
            <form id="username-form">
                <div class="form-group">
                    <label for="new-username">New username</label>
                    <input type="text" id="new-username" placeholder="New username" required>
                </div>
                <button type="submit" class="btn-primary">Save username</button>
                <p class="form-status" id="username-status"></p>
            </form>
        </section>

        <!-- Change password -->
        <section class="profile-section">
            <h2>Change password</h2>
            <form id="password-form">
                <div class="form-group">
                    <label for="current-password">Current password</label>
                    <input type="password" id="current-password" placeholder="Current password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" placeholder="New password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Confirm new password</label>
                    <input type="password" id="confirm-new-password" placeholder="Confirm new password" minlength="6" required>
                </div>
                <button type="submit" class="btn-primary">Change password</button>
                <p class="form-status" id="password-status"></p>
            </form>
        </section>

        <!-- Danger zone -->
        <section class="profile-section danger">
            <h2>Delete account</h2>
            <p>This will permanently delete your account and all data. This cannot be undone.</p>
            <button type="button" class="btn-danger" id="delete-btn">Delete my account</button>
        </section>

        <!-- Logout -->
        <section class="profile-section">
            <button type="button" class="btn-secondary" id="logout-btn">Log out</button>
        </section>

    </div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
